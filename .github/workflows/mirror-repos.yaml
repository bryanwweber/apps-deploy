name: Mirror GitHub Repos to Forgejo

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mirror-repos.yaml"
      - "forgejo/sync-github-repos.py"
  schedule:
    - cron: "17 2 3 * *"

permissions: {}

jobs:
  mirror-repos:
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions
          ping: ${{ vars.HETZNER_HOST }}
      - name: Mirror repos
        run: uv run forgejo/sync-github-repos.py --host-url "$HOST_URL"
        env:
          FORGEJO_API_KEY: ${{ secrets.FORGEJO_API_KEY }}
          GH_AUTH_TOKEN: ${{ secrets.GH_AUTH_TOKEN }}
          HOST_URL: ${{ vars.FORGEJO_HOST }}

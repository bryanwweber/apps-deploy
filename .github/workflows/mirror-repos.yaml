name: Mirror GitHub Repos to Forgejo

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mirror-repos.yaml"
      - "forgejo/sync-github-repos.py"
  schedule:
    - cron: "17 2 3 * *"

permissions: {}

jobs:
  mirror-repos:
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions
          ping: ${{ vars.HETZNER_HOST }}
      - name: Mirror repos
        run: uv run forgejo/sync-github-repos.py --host-url "$HOST_URL"
        env:
          FORGEJO_API_KEY: ${{ secrets.FORGEJO_API_KEY }}
          GH_AUTH_TOKEN: ${{ secrets.GH_AUTH_TOKEN }}
          HOST_URL: ${{ vars.FORGEJO_HOST }}
